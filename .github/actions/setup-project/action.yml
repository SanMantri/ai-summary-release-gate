name: Set up project
description: Install Node.js from .nvmrc and the project's locked dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js from .nvmrc
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install locked dependencies
      shell: bash
      run: npm ci
