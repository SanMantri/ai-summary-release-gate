name: release-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  developer-checks:
    name: developer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_ARTIFACT_NAME: developer-checks-evidence-attempt-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Developer unit tests
        run: npm run test:unit

      - name: Build dashboard UI
        run: npm run build:ui

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-evidence
        with:
          artifact-name: ${{ env.EVIDENCE_ARTIFACT_NAME }}

  api-tests:
    name: api-tests
    needs: developer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_ARTIFACT_NAME: api-tests-evidence-attempt-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: API tests (contract, error mapping, approval enforcement)
        run: npx playwright test --project=api

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-evidence
        with:
          artifact-name: ${{ env.EVIDENCE_ARTIFACT_NAME }}

  ui-tests:
    name: ui-tests
    needs: developer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_ARTIFACT_NAME: ui-tests-evidence-attempt-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests (AI service faked in the browser) and full-stack smoke tests
        run: npx playwright test --project=ui-chromium --project=smoke-chromium

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-evidence
        with:
          artifact-name: ${{ env.EVIDENCE_ARTIFACT_NAME }}

  summary-evaluation:
    name: summary-evaluation
    needs: developer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_ARTIFACT_NAME: summary-evaluation-evidence-attempt-${{ github.run_attempt }}
      RELEASE_GATE_LAYER: eval
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Deterministic summary evaluation (labeled synthetic examples)
        run: npx playwright test --project=eval

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-evidence
        with:
          artifact-name: ${{ env.EVIDENCE_ARTIFACT_NAME }}

  # ── Advisory jobs: reported on every run, never block a release (not in release-gate's needs) ──

  cross-browser-ui:
    name: cross-browser-ui (${{ matrix.browser }}, advisory)
    needs: developer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      EVIDENCE_ARTIFACT_NAME: cross-browser-ui-${{ matrix.browser }}-evidence-attempt-${{ github.run_attempt }}
      RELEASE_GATE_ADVISORY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: UI tests on ${{ matrix.browser }} (advisory)
        run: npx playwright test --project=ui-${{ matrix.browser }}

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-evidence
        with:
          artifact-name: ${{ env.EVIDENCE_ARTIFACT_NAME }}

  quarantined-tests:
    name: quarantined-tests (advisory)
    needs: developer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      EVIDENCE_ARTIFACT_NAME: quarantined-tests-evidence-attempt-${{ github.run_attempt }}
      RELEASE_GATE_ADVISORY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests tagged @quarantined (excluded from the gate, still run and reported)
        run: npx playwright test --project=quarantined --pass-with-no-tests

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-evidence
        with:
          artifact-name: ${{ env.EVIDENCE_ARTIFACT_NAME }}

  # ── The single required status check ──
  # It always runs and fails unless every blocking job succeeded: GitHub skips the dependents
  # of a failed job, and a skipped required check would otherwise count as passing.
  release-gate:
    name: release-gate
    if: always()
    needs: [developer-checks, api-tests, ui-tests, summary-evaluation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking job to succeed
        env:
          BLOCKING_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Release gate"
            echo
            echo "| Blocking job | Result |"
            echo "|---|---|"
            echo "$BLOCKING_JOB_RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          jobs_that_did_not_succeed=$(echo "$BLOCKING_JOB_RESULTS" \
            | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')

          if [ -n "$jobs_that_did_not_succeed" ]; then
            echo "::error title=Release blocked::These blocking jobs did not succeed: $jobs_that_did_not_succeed"
            printf '\n**Release blocked.** Did not succeed: %s\n' "$jobs_that_did_not_succeed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          printf '\n**Release allowed.** Every blocking job succeeded.\n' >> "$GITHUB_STEP_SUMMARY"
